<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare AI Project Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #chat-container::-webkit-scrollbar {
            width: 8px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .message {
            max-width: 80%;
            word-wrap: break-word;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center h-screen">

    <div class="bg-white w-full max-w-2xl h-full md:h-[90vh] md:max-h-[700px] rounded-lg shadow-2xl flex flex-col">
        <header class="bg-blue-600 text-white p-4 rounded-t-lg flex items-center">
            <h1 class="text-xl font-bold">Cloudflare Project Idea Assistant</h1>
        </header>

        <main id="chat-container" class="flex-1 p-6 overflow-y-auto space-y-4">
            <!-- Messages will be injected here -->
            <div class="flex justify-start">
                <div class="message bg-gray-200 text-gray-800 p-3 rounded-lg rounded-bl-none">
                    <p>Hello! I'm an AI assistant. What kind of project are you thinking of building on Cloudflare today?</p>
                </div>
            </div>
        </main>

        <footer class="p-4 border-t">
            <form id="chat-form" class="flex items-center space-x-2">
                <input 
                    id="message-input" 
                    type="text" 
                    placeholder="Ask for a project idea..." 
                    class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    id="send-button"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-200 flex items-center justify-center disabled:bg-blue-300">
                    Send
                </button>
            </form>
        </footer>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatContainer = document.getElementById('chat-container');
        const sendButton = document.getElementById('send-button');

        // Set your Cloudflare Worker URL here
        const workerUrl = 'https://cf-ai-aaditya.workers.dev'; 

        // Generate a unique session ID for this conversation
        const sessionId = crypto.randomUUID();

        // Function to add a message to the chat display
        const addMessage = (sender, text) => {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('flex', sender === 'user' ? 'justify-end' : 'justify-start');
            
            const messageBubble = document.createElement('div');
            messageBubble.classList.add('message', 'p-3', 'rounded-lg');
            if (sender === 'user') {
                messageBubble.classList.add('bg-blue-600', 'text-white', 'rounded-br-none');
            } else {
                messageBubble.classList.add('bg-gray-200', 'text-gray-800', 'rounded-bl-none');
            }
            messageBubble.textContent = text;
            
            messageDiv.appendChild(messageBubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        // Handle form submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = messageInput.value.trim();

            if (!messageText) return;

            if (workerUrl === 'YOUR_WORKER_URL_HERE') {
                addMessage('ai', 'Error: Please set your Cloudflare Worker URL in the index.html file.');
                return;
            }

            // Display user's message
            addMessage('user', messageText);
            messageInput.value = '';
            sendButton.disabled = true;

            // Add a "thinking..." indicator
            const thinkingIndicator = document.createElement('div');
            thinkingIndicator.classList.add('flex', 'justify-start', 'thinking');
            thinkingIndicator.innerHTML = `
                <div class="message bg-gray-200 text-gray-500 p-3 rounded-lg rounded-bl-none italic">
                    Thinking...
                </div>
            `;
            chatContainer.appendChild(thinkingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Send message to the Cloudflare Worker
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        message: messageText,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`Worker responded with status: ${response.status}`);
                }

                const data = await response.json();
                
                // Remove "thinking..." indicator and display AI response
                chatContainer.removeChild(thinkingIndicator);
                addMessage('ai', data.response);

            } catch (error) {
                console.error('Error communicating with worker:', error);
                chatContainer.removeChild(thinkingIndicator);
                addMessage('ai', 'Sorry, I encountered an error. Please try again.');
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        });
    </script>
</body>
</html>
